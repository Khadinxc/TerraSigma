id: 483770f3-9c44-5363-aa53-26c426dfa48f
name: HackTool - GoldenDMSA Execution
description: No description provided
severity: High
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- PrivilegeEscalation
- CredentialAccess
query: |-
  DeviceProcessEvents
  | where ((ProcessCommandLine contains "wordlist" or ProcessCommandLine contains "bruteforce") and (ProcessCommandLine contains " -s " and ProcessCommandLine contains "S-1-5-21-" and ProcessCommandLine contains " -d " and ProcessCommandLine contains " -k ")) or FolderPath endswith "\\GoldenDMSA.exe"
version: 1.0.0
kind: Scheduled
relevantTechniques:
- T1098
- T1110
- T1558
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: InitiatingProcessAccountName
  - identifier: NTDomain
    columnName: InitiatingProcessAccountDomain
  - identifier: Sid
    columnName: InitiatingProcessAccountSid
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
  - identifier: AzureID
    columnName: DeviceId
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: ProcessCommandLine
- entityType: File
  fieldMappings:
  - identifier: Directory
    columnName: FolderPath
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
